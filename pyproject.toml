[project]
name = "flasky"
version = "2.0.0"
description = "A modern Flask application template and example"
authors = [
    {name = "User", email = "user@example.com"},
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "Flask>=3.0.0",
    "bootstrap-flask>=2.2.0",
    "Flask-HTTPAuth>=4.8.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.0.0",
    "Flask-Login>=0.6.3",
    "Flask-Mail>=0.9.1",
    "Flask-Moment>=1.0.5",
    "Flask-WTF>=1.2.1",
    "email-validator>=2.1.0",
    "Flask-Babel>=4.0.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.2.0",
    "psycopg2-binary>=2.9.9",
    "bleach>=6.0.0",
    "markdown>=3.5.0",
    "cryptography>=41.0.0"
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=7.0.0",
    "coverage>=7.0.0",
    "faker>=19.0.0",
    "httpie>=3.2.2"
]
